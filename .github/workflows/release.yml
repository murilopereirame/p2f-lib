# Build and test everything (ci.yml), then publish:
#   - on a merge to main (or a manual run): if VERSION has no release yet, a
#     GitHub Release v<version> with the desktop, PS4, Android and iOS
#     libraries, the WebAssembly core and the npm tarball. A merge that does
#     not change VERSION builds and tests, and publishes nothing.
#   - on a GitHub release published by hand (for example from the tag that
#     the "Bump version" workflow made): the same files, attached to that
#     release. Its tag must be v<VERSION>.
#   - either way, the npm package @murilopereirame/p2f-lib on GitHub
#     Packages, if that version is not there yet.
name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p2f-lib*
          path: out
      - id: version
        run: |
          v=$(cat VERSION)
          js=$(node -p "require('./js/package.json').version")
          if [ "$v" != "$js" ]; then
            echo "::error::VERSION ($v) and js/package.json ($js) differ"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "$tag" != "v$v" ]; then
              echo "::error::release tag $tag does not match VERSION $v (expected v$v)"
              exit 1
            fi
            echo "exists=attach" >> "$GITHUB_OUTPUT"
          elif gh release view "v$v" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$v is already released. Bump VERSION and js/package.json to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: GitHub Release
        if: steps.version.outputs.exists == 'false'
        run: |
          v=${{ steps.version.outputs.version }}
          gh release create "v$v" --target "$GITHUB_SHA" --title "p2f-lib $v" \
            --notes "Built from $GITHUB_SHA.

          - \`p2f-lib-$v-ps4.tar.gz\`: PS4 (OpenOrbis) static library + header
          - \`p2f-lib-$v-linux-x86_64.tar.gz\`: desktop static library, header, \`p2f-cli\`
          - \`p2f-lib-$v-android.tar.gz\`: Android static libraries (arm64-v8a, armeabi-v7a, x86_64; API 24+) + headers
          - \`p2f-lib-$v-ios.zip\`: \`P2F.xcframework\` (iOS 13+ device and simulator)
          - \`p2f-$v.wasm\`: the WebAssembly core
          - \`murilopereirame-p2f-lib-$v.tgz\`: the JavaScript package (also on GitHub Packages)

          npm: \`\"p2f-lib\": \"https://github.com/$GITHUB_REPOSITORY/releases/download/v$v/murilopereirame-p2f-lib-$v.tgz\"\`" \
            $(find out -type f \( -name "p2f-*" -o -name "*.tgz" \))
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach to the release
        if: steps.version.outputs.exists == 'attach'
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" --clobber \
            $(find out -type f \( -name "p2f-*" -o -name "*.tgz" \))
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists != 'true'
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@murilopereirame'
      - name: GitHub Packages (npm)
        if: steps.version.outputs.exists != 'true'
        run: |
          v=${{ steps.version.outputs.version }}
          if [ "$(npm view "@murilopereirame/p2f-lib@$v" version 2>/dev/null)" = "$v" ]; then
            echo "::notice::@murilopereirame/p2f-lib@$v is already on GitHub Packages"
          else
            npm publish "$(find out -type f -name "murilopereirame-p2f-lib-$v.tgz")"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
