name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build + test (desktop, PS4, WebAssembly, JS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache toolchains and third-party sources
        uses: actions/cache@v4
        with:
          path: |
            toolchains
            third_party
          key: toolchains-${{ hashFiles('scripts/install_toolchains.sh', 'scripts/fetch_deps.sh') }}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm python3-cryptography bc
      - run: scripts/fetch_deps.sh
      - name: Toolchains
        run: scripts/install_toolchains.sh ps4 wasm | tee -a "$GITHUB_ENV"

      - name: Desktop library + end-to-end tests
        run: make -j"$(nproc)" test
      - name: PS4 library
        run: make -j"$(nproc)" ps4 PS4_AR=llvm-ar
      - name: WebAssembly core
        run: make -j"$(nproc)" wasm

      - name: JavaScript package
        working-directory: js
        run: |
          npm ci
          npm test
          npm pack

      - name: Release bundles
        run: make dist PS4_AR=llvm-ar
      - uses: actions/upload-artifact@v4
        with:
          name: p2f-lib
          path: |
            dist/*
            js/*.tgz
          if-no-files-found: error

  android:
    name: Android libraries (NDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/fetch_deps.sh') }}
      - run: scripts/fetch_deps.sh
      # The runner image has the NDK installed; ANDROID_NDK_LATEST_HOME is it.
      - name: Android libraries (arm64-v8a, armeabi-v7a, x86_64)
        run: make -j"$(nproc)" dist-android ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
      - name: Check the archives
        run: |
          for a in arm64-v8a armeabi-v7a x86_64; do
            "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm build/android/$a/libp2f.a \
              | grep -q ' T p2f_download_path$'
            "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm build/android/$a/libp2f.a \
              | grep -q ' W p2f_platform_random$'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: p2f-lib-android
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS XCFramework
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/fetch_deps.sh') }}
      - run: scripts/fetch_deps.sh
      - name: iOS XCFramework (device arm64, simulator arm64 + x86_64)
        run: make -j"$(sysctl -n hw.ncpu)" dist-ios
      - name: Check the libraries
        run: |
          lipo -info build/ios/device/libp2f.a build/ios/simulator/libp2f.a
          nm build/ios/device/libp2f.a | grep -q ' T _p2f_download_path$'
          ls build/ios/P2F.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: p2f-lib-ios
          path: dist/*
          if-no-files-found: error
